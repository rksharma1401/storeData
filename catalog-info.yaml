apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: google-auth-local
  title: Google Auth (Local/Test/Demo)
  description: Google OAuth 2.0 Identity Provider configured for local development or testing
  tags:
    - idp
    - google
    - oauth
  annotations:
    backstage.io/adr-location: https://github.com/rksharma1401/storeData/tree/main/adr/
    github.com/project-slug: rksharma1401/google-auth-local
    backstage.io/techdocs-ref: https://github.com/rksharma1401/storeData/tree/main/docs/
    circleci.com/project-slug: github/rksharma1401/google-auth-local
    jenkins.io/job-full-name: platform-team/google-auth-local
spec:
  type: service
  lifecycle: development
  owner: group:default/platform-team
  system: system:default/identity
  providesApis:
    - google-oauth-api
    - google-token-validation-api
    - google-userinfo-api
  dependsOn:
    - component:google-oauth-client
    - component:google-auth-sdk
  consumesApis:
    - google-oauth-api
    - google-userinfo-api
  documentation:
    - url: https://github.com/rksharma1401/storeData/tree/main/docs
  ci:
    - type: circleci
      url: https://app.circleci.com/pipelines/github/rksharma1401/google-auth-local
    - type: jenkins
      url: https://jenkins.example.com/job/platform-team/job/google-auth-local/
  links:
    - url: http://localhost:9090/oauth2callback
      title: Google OAuth Callback Endpoint
      icon: dashboard
    - url: https://github.com/rksharma1401/storeData/tree/main/adr/
      title: Architecture Decision Records
      icon: description
    - url: https://jenkins.example.com/job/platform-team/job/google-auth-local/
      title: Jenkins CI/CD Pipeline
      icon: build
