apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: google-auth-local
  title: Google Auth (Local/Test)
  description: "Google OAuth 2.0 Identity Provider configured for local development or testing"
  tags:
    - idp
    - google
    - oauth
  annotations:
    backstage.io/adr-location: https://github.com/rksharma1401/storeData/tree/main/adr
    github.com/project-slug: rksharma1401/google-auth-local
    backstage.io/techdocs-ref: dir:.
    circleci.com/project-slug: github/rksharma1401/google-auth-local

  links:
    - url: http://localhost:9090/oauth2callback
      title: Google OAuth Callback Endpoint
      icon: dashboard
    - url: https://github.com/rksharma1401/storeData/tree/main/adr
      title: Architecture Decision Records
      icon: description
spec:
  type: service
  lifecycle: development
  owner: group:default/platform-team
  system: system:default/identity
  providesApis:
    - google-oauth-api
    - google-token-validation-api
    - google-userinfo-api
  dependsOn:
    - component:library/google-oauth-client
    - component:library/google-auth-sdk
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: google-oauth-api
  description: Google OAuth 2.0 API for authentication and authorization
spec:
  type: openapi
  lifecycle: development
  owner: group:default/platform-team
  definition: |
    openapi: 3.0.0
    info:
      title: Google OAuth API
      version: "1.0.0"
    servers:
      - url: http://localhost:9090
    paths:
      /oauth2/v2/auth:
        get:
          summary: Initiate OAuth flow
          responses:
            '302':
              description: Redirect to Google login
      /oauth2/v2/token:
        post:
          summary: Exchange code for access token
          responses:
            '200':
              description: Token response
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: google-token-validation-api
  description: Validate Google OAuth tokens
spec:
  type: openapi
  lifecycle: development
  owner: group:default/platform-team
  definition: |
    openapi: 3.0.0
    info:
      title: Google Token Validation API
      version: "1.0.0"
    servers:
      - url: http://localhost:9090
    paths:
      /tokeninfo:
        get:
          summary: Validate access token
          parameters:
            - name: access_token
              in: query
              required: true
              schema:
                type: string
          responses:
            '200':
              description: Token is valid
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: google-userinfo-api
  description: Retrieve user profile from Google
spec:
  type: openapi
  lifecycle: development
  owner: group:default/platform-team
  definition: |
    openapi: 3.0.0
    info:
      title: Google User Info API
      version: "1.0.0"
    servers:
      - url: http://localhost:9090
    paths:
      /userinfo:
        get:
          summary: Get user profile
          responses:
            '200':
              description: User profile data
